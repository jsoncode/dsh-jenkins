# 发布工作流：推送 v* tag 时触发
# - release job：安装依赖 + 类型检查（tsc -b）+ 构建（tsc -b && tsdown）→ 打包并直接创建 GitHub Release（非草稿），不依赖 npm 凭证
# - publish-npm job：发布到 npm（需要仓库 Secret：NPM_TOKEN），缺 token 时快速失败并给出明确提示
#
# 宿主半边构建为 lib/index.js（ESM）；浏览器半边由 tsdown 构建为 lib/client.js
# （__ModuleLoader__ 单文件 CJS 工厂，banner 包装）。产物提交 git（git 安装无需
# 构建），此处重建是为了保证发布内容与 tag 源码一致。
name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        # 用 npm install 而非 npm ci：peerDependencies 的 caret 范围（如
        # ^0.1.0-rc.6）在 registry 发新版（rc.7/rc.8…）后，npm ci 的 lock 严格
        # 校验会因“lock 缺少最新解析”而失败（EUSAGE）。npm install 按声明范围
        # 重新解析安装，不受 lock 校验约束。
        run: npm install

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify bundle
        run: npm run verify

      - name: Pack tarball
        run: npm pack

      - name: Create GitHub Release (published, not draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            *.tgz

  publish-npm:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check NPM_TOKEN
        if: ${{ !env.NPM_TOKEN }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::error::NPM_TOKEN secret is not configured. Add an npm access token to Settings → Secrets and variables → Actions, then re-run this workflow."
          exit 1

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
