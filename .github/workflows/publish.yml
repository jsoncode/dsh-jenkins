# 发布工作流：推送 v* tag 时触发
# - release job：安装依赖（pnpm frozen-lockfile）+ 类型检查（tsc -b）+ 构建（tsc -b && tsdown）→ 打包并直接创建 GitHub Release（非草稿），不依赖 npm 凭证
# - publish-npm job：发布到 npm（需要仓库 Secret：NPM_TOKEN），缺 token 时快速失败并给出明确提示
#
# 宿主半边构建为 lib/index.js（ESM）；浏览器半边由 tsdown 构建为 lib/client.js
# （__ModuleLoader__ 单文件 CJS 工厂，banner 包装）。产物提交 git（git 安装无需
# 构建），此处重建是为了保证发布内容与 tag 源码一致。
#
# 历史排障记录（勿删）：v0.1.26~v0.1.28 的 release job 一直挂在 Setup Node 步骤，
# 报错 "Unable to locate executable file: pnpm"。先后尝试过 npm install -g、
# pnpm/action-setup、npx 调用 pnpm 均无效——真正的根因是 setup-node@v5 的
# package-manager-cache 自动缓存：该选项默认开启，会读取 package.json 的
# packageManager 字段（pnpm@10.33.0），随后执行 `pnpm store path` 定位缓存目录；
# 而 Setup Node 步骤执行时 pnpm 尚未安装（node 26 不再捆绑 corepack），因此失败。
# 修复：在两个 Setup Node 步骤显式设置 package-manager-cache: false，关闭自动缓存。
name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          # 关闭 package-manager-cache 自动缓存（v5 默认开启）：它会把 package.json
          # 的 packageManager 字段识别为 pnpm 并执行 `pnpm store path`，而本步骤
          # 执行时 pnpm 尚未安装（node 26 不捆绑 corepack），导致
          # "Unable to locate executable file: pnpm"。pnpm 由后续步骤经 npx 临时
          # 调用，无需 setup-node 做缓存恢复。
          package-manager-cache: false

      - name: Install dependencies
        # 用 npx 直接调用 pnpm（node 26 自带 npm，npx 一定可用）：pnpm 临时下载
        # 执行，不依赖 corepack（node 25+ 已移除）或任何第三方 action。版本固定为
        # 与 package.json 的 packageManager 字段一致（升级 pnpm 时需同步更新）。
        # frozen-lockfile 严格按 pnpm-lock.yaml 安装，pnpm 完整记录 peer 解析，
        # 无 npm arborist 崩溃（edgesOut）与 lock 校验问题。
        run: npx --yes pnpm@10.33.0 install --frozen-lockfile

      - name: Type check
        run: npx --yes pnpm@10.33.0 run check

      - name: Build
        run: npx --yes pnpm@10.33.0 run build

      - name: Verify bundle
        run: npx --yes pnpm@10.33.0 run verify

      - name: Pack tarball
        run: npx --yes pnpm@10.33.0 pack

      - name: Create GitHub Release (published, not draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            *.tgz

  publish-npm:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          # 与 release job 同理：关闭 package-manager-cache 自动缓存，避免
          # setup-node 读取 packageManager 字段后尝试执行 pnpm 而失败。
          package-manager-cache: false

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 在 shell 内检查 token（不用 step 级 if 判断：step 自己的 env 在它
          # 自己的 if 条件里读不到，会导致 secret 已配置也误报"未配置"）。
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured. Add an npm access token to Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
