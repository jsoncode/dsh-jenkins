# 发布工作流：推送 v* tag 时触发
# - release job：安装依赖（pnpm frozen-lockfile）+ 类型检查（tsc -b）+ 构建（tsc -b && tsdown）→ 打包并直接创建 GitHub Release（非草稿），不依赖 npm 凭证
# - publish-npm job：发布到 npm（需要仓库 Secret：NPM_TOKEN），缺 token 时快速失败并给出明确提示
#
# 宿主半边构建为 lib/index.js（ESM）；浏览器半边由 tsdown 构建为 lib/client.js
# （__ModuleLoader__ 单文件 CJS 工厂，banner 包装）。产物提交 git（git 安装无需
# 构建），此处重建是为了保证发布内容与 tag 源码一致。
name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install dependencies
        # 用 npx 直接调用 pnpm（node 26 自带 npm，npx 一定可用）：pnpm 临时下载
        # 执行，不依赖 corepack（node 25+ 已移除）或任何第三方 action 的 PATH 配置
        # （npm install -g 与 pnpm/action-setup 在 node 26 环境均出现过 pnpm 不在
        # PATH 的问题）。frozen-lockfile 严格按 pnpm-lock.yaml 安装，pnpm 完整记录
        # peer 解析，无 npm arborist 崩溃（edgesOut）与 lock 校验问题。
        run: npx --yes pnpm@10 install --frozen-lockfile

      - name: Type check
        run: npx --yes pnpm@10 run check

      - name: Build
        run: npx --yes pnpm@10 run build

      - name: Verify bundle
        run: npx --yes pnpm@10 run verify

      - name: Pack tarball
        run: npx --yes pnpm@10 pack

      - name: Create GitHub Release (published, not draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            *.tgz

  publish-npm:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Check NPM_TOKEN
        if: ${{ !env.NPM_TOKEN }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::error::NPM_TOKEN secret is not configured. Add an npm access token to Settings → Secrets and variables → Actions, then re-run this workflow."
          exit 1

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
